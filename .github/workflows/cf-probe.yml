name: CF Probe

# THROWAWAY investigation workflow — Franklin/Hamilton Cloudflare re-test from
# a GitHub Actions datacenter IP (comparison leg to the local re-test).
# No scraping, no data commits. Remove after the investigation is signed off.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Cloudflare probe (datacenter IP)
        run: python scripts/cf_probe.py data/diagnostics/cf-probe
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-probe-datacenter
          path: data/diagnostics/cf-probe/
          if-no-files-found: warn
          retention-days: 7
