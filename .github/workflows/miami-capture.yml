name: Miami Capture

# THROWAWAY: capture real Miami-Dade docket HTML for the acceptance-test fixtures.
# Manual-dispatch only. Not part of the daily pipeline. Safe to delete once
# tests/test_miami_dade_docket.py fixtures are committed. Uploads artifacts only.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated Miami-Dade case numbers (empty = default fixture set)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Capture Miami-Dade docket HTML (headless, datacenter IP)
        run: python scripts/miami_capture.py "${{ github.event.inputs.cases }}"
      - name: Upload captured docket HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miami-cases
          path: data/samples/miami_dade/cases/
          if-no-files-found: warn
          retention-days: 7
