name: Cuyahoga Investigate

# THROWAWAY Phase-1 probe: does Cuyahoga's cpdocket portal expose the judgment
# DECREE document (for the oh_debt conservative-debt port), or only the structured
# Prayer Amount field? Manual dispatch; not part of cron; artifacts only. Remove
# after the Cuyahoga investigation is signed off.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated Cuyahoga case numbers to probe'
        required: false
        default: 'CV19923457,CV25115432,CV25110566,CV24106082,CV25111605'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Probe Cuyahoga for judgment-decree documents
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            python scripts/cuyahoga_decree_probe.py "${{ github.event.inputs.cases }}"
      - name: Upload Cuyahoga decree diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuyahoga-decree-probe
          path: data/diagnostics/cuyahoga-oh/
          if-no-files-found: warn
          retention-days: 7
