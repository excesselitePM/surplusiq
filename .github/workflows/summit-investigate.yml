name: Summit Investigate

# THROWAWAY investigation workflow — pull REAL Summit judgment PDFs + their
# pdfplumber text for a handful of cases so we can see what's actually
# extractable (principal / interest rate + from-date / per-diem / itemized vs
# vague costs / stated total) before redesigning the debt extractor. Runs the
# EXISTING scraper unchanged (no code change). Manual-dispatch only; not part of
# the daily pipeline; cron untouched. Artifacts only — commits nothing. Delete
# after the Summit debt investigation is signed off.
#
# --case filters by the 8-char prefix (CV+year+month), so each prefix pulls that
# whole month-group. Defaults capture the client's walked cases:
#   CV202412 → CV2024125264 (6973 VAN BUREN RD, sale $277,300 — the false-surplus case)
#   CV202505 → CV2025052012 (375 REVERE RD, sale $258,100 — the "Revere" case)
#   CV201906 → CV2019062134 (2540 ROYAL COUNTY DOWN — older case, older interest from-date)

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated EXACT Summit case numbers (direct scrape, bypasses raw-file load)'
        required: false
        default: 'CV2024125264,CV2025052012,CV2025115614,CV2025105047'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install xvfb (Summit may CAPTCHA → headed under xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Scrape Summit judgment PDFs by exact case number
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            python scripts/summit_pull_judgments.py "${{ github.event.inputs.cases }}" \
            || echo "::warning::summit judgment pull had issues"
      - name: Upload Summit judgment diagnostics (PDFs + extracted text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-judgment-pdfs
          path: data/diagnostics/summit-oh/
          if-no-files-found: warn
          retention-days: 7
