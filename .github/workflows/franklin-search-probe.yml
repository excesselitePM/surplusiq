name: Franklin Search Probe

# THROWAWAY — proves the Franklin CIO SEARCH flow (not just the landing page)
# works from a datacenter IP. No scraping, no data commits. Remove after sign-off.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/franklin_search_probe.py data/diagnostics/franklin-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franklin-search-probe
          path: data/diagnostics/franklin-probe/
          if-no-files-found: warn
          retention-days: 7
