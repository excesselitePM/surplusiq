name: Montgomery Decree Probe

# THROWAWAY Phase-1 investigation workflow for the Montgomery oh_debt port.
# Runs scripts/montgomery_decree_probe.py against real cases, saves the full
# judgment-decree text as an artifact. No production code touched, no data
# committed. Remove after the Montgomery extractor is signed off.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated Montgomery case numbers (blank = default 6-case diverse sample)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run decree probe
        run: |
          if [ -n "${{ github.event.inputs.cases }}" ]; then
            python scripts/montgomery_decree_probe.py "${{ github.event.inputs.cases }}"
          else
            python scripts/montgomery_decree_probe.py
          fi
      - name: Upload decree texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-decrees
          path: |
            data/samples/montgomery/ci/
            data/diagnostics/montgomery-oh/
          if-no-files-found: warn
          retention-days: 7
