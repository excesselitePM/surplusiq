name: Broward Investigate

# THROWAWAY investigation workflow (Broward docket-detail hop + CAPTCHA-from-CI
# check). Not part of the daily pipeline. Manual-dispatch only. Safe to delete
# once Broward investigation is signed off. Does NOT commit anything.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated Broward case numbers (with or without dashes)'
        required: false
        default: 'CACE-13-021361,CACE-24-010415'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Broward investigation probe (headless, datacenter IP)
        run: python scripts/broward_investigate.py "${{ github.event.inputs.cases }}"

      - name: Upload investigation artifacts (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broward-investigation
          path: data/samples/broward/ci/
          if-no-files-found: warn
          retention-days: 7
